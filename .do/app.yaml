name: optisupply

services:
  - name: backend
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: ne3mer/optisupply
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health-check
      initial_delay_seconds: 30
      period_seconds: 30
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://optisupply-front.onrender.com,https://optisupply.vercel.app,https://optisupply-frontend.vercel.app,https://ethicsupply-frontend.vercel.app,https://optisupp.netlify.app,https://octopus-app-j6min.ondigitalocean.app"
      # MONGODB_URI and JWT_SECRET are managed via the DO dashboard (Secrets) — do NOT put them here
