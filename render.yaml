# Render deployment config — frontend only.
# Backend runs on DigitalOcean App Platform (see .do/app.yaml).
services:
  - type: web
    name: optisupply-front
    runtime: static
    rootDir: ethicsupply-frontend
    buildCommand: ./build.sh
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_URL
        value: https://octopus-app-j6min.ondigitalocean.app/api
      - key: VITE_ENABLE_MOCK_DATA
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
