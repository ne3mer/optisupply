name: Build and deploy Node.js app to Azure Web App - optisupply-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: optisupply-api
  AZURE_WEBAPP_PACKAGE_PATH: ethicsupply-node-backend
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify package
        run: |
          npm ci --omit=dev
          npm ls express
          npm ls methods
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Remove node_modules before deployment
        run: rm -rf node_modules
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Upload backend source
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3464204126BD47568E664423A0EF19C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_95215755DE56484E91A5739D276AB6D8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A65E575D49B44C7B8DE9E7B6AF9038E5 }}

      - name: Enable Azure build automation
        run: |
          az webapp config appsettings set \
            --resource-group optisupply-rg \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
