# Leapcell service config (root). Platform health checks must match the Node listen port.
port: 8080

build:
  command: npm install --prefix ethicsupply-node-backend

start:
  command: node ethicsupply-node-backend/start.js

env:
  NODE_ENV: production
  PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://optisupply-front.onrender.com,https://optisupply.vercel.app,https://optisupply-frontend.vercel.app,https://ethicsupply-frontend.vercel.app,https://optisupp.netlify.app,https://octopus-app-j6min.ondigitalocean.app"
  # MONGODB_URI: set this in Leapcell dashboard (Secrets) — do NOT put it here
