service:
  name: ethicsupply-backend
  root: ./ethicsupply-node-backend   # Build context for Leapcell

  build:
    command: npm ci --only=production
  start:
    command: npm start            # Uses package.json start script (node start.js)
  env:
    NODE_ENV: production
    PORT: 10000
    CORS_ALLOWED_ORIGINS: "https://optisupply.vercel.app,https://optisupp.netlify.app,http://localhost:5173"
    JWT_SECRET: "REDACTED"
    MONGODB_URI: "REDACTED"
